name: Circadia
options:
  bundleIdPrefix: com.foggylulu
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  CircadianKit:
    path: Packages/CircadianKit

configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Circadia:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/Circadia
    dependencies:
      - package: CircadianKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Circadia
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSLocationWhenInUseUsageDescription: >-
          Circadia can use your location once to pre-select the airport you are
          flying from. Your location is never stored or sent anywhere.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.foggylulu.circadia
        PRODUCT_NAME: Circadia
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES

schemes:
  Circadia:
    build:
      targets:
        Circadia: all
    run:
      config: Debug
    test:
      config: Debug
